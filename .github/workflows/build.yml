name: build-apk
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure signing keystore (generated once, committed back for stable updates)
        run: |
          if [ ! -f keystore.jks ]; then
            keytool -genkeypair -v -keystore keystore.jks -alias gibbon -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass gibbonsings -keypass gibbonsings -dname "CN=Gibbon, O=Almusallah"
            git config user.name "github-actions"
            git config user.email "actions@users.noreply.github.com"
            git add keystore.jks
            git commit -m "ci: persist signing keystore [skip ci]"
            git push
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build signed release APK
        run: gradle assembleRelease -PverCode=${{ github.run_number }}
      - name: Stage artifact
        run: cp app/build/outputs/apk/release/app-release.apk saigon-sampler.apk
      - name: Publish to the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Saigon Sampler (latest)
          body: "Signed APK — download on the phone and install (allow 'unknown sources' once). Build #${{ github.run_number }}."
          files: saigon-sampler.apk
